<title>交通費集計</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --blue:#1A56A0;--blue-light:#E8F0FA;--red:#D84040;
 --bg:#F5F7FA;--surface:#fff;--border:#E2E8F0;
 --text:#1a202c;--muted:#718096;--sub:#A0AEC0;
 --radius:12px;--radius-sm:8px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg)}

/* Header */
.header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--blue);color:#fff;flex-shrink:0}
.header img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.header-title{font-size:16px;font-weight:700;letter-spacing:0.02em}
.header-sub{font-size:10px;opacity:0.75;margin-top:1px}

/* Scroll area */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 16px}

/* Tab bar */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:10px;color:var(--muted);border:none;background:none;cursor:pointer;transition:color .15s}
.tab svg{width:22px;height:22px;stroke-width:1.7}
.tab.active{color:var(--blue)}

/* Pane */
.pane{display:none;padding:14px 16px}
.pane.active{display:block}

/* Section label */
.slabel{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.slabel:first-child{margin-top:0}

/* Calendar */
.cal-wrap{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:4px}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}
.cal-title{font-size:15px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cdn{text-align:center;font-size:10px;color:var(--muted);padding:3px 0;font-weight:500}
.cd{text-align:center;padding:7px 2px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--text);position:relative;transition:background .1s}
.cd:active{background:#E2E8F0}
.cd.sel{background:var(--blue);color:#fff;font-weight:600}
.cd.today{color:var(--blue);font-weight:600}
.cd.today.sel{color:#fff}
.cd.dot::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--red)}
.cd.sel.dot::after{background:#fff}

/* Transport buttons */
.t-row{display:flex;gap:8px;margin-bottom:4px}
.tbtn{flex:1;padding:12px 4px 10px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;font-family:inherit}
.tbtn svg{width:26px;height:26px;stroke-width:1.6}
.tbtn.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}

/* Input fields */
.field{background:var(--surface);border-radius:var(--radius);padding:0 14px;margin-bottom:8px}
.field-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:13px;color:var(--muted);white-space:nowrap;min-width:70px}
.field-row input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--text);font-family:inherit;text-align:right}
.field-row input::placeholder{color:var(--sub)}
.field-unit{font-size:13px;color:var(--muted)}

/* Preview */
.preview{background:var(--blue-light);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--blue);text-align:center}
.preview b{font-size:18px;font-weight:700}

/* Add button */
.add-btn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.02em;active:opacity .15s}
.add-btn:active{opacity:.85}

/* Summary */
.month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-label{font-size:16px;font-weight:700}

.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.scard{background:var(--surface);border-radius:var(--radius);padding:14px}
.scard-label{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.scard-label svg{width:14px;height:14px;stroke-width:2}
.scard-val{font-size:20px;font-weight:700;color:var(--text)}
.scard-sub{font-size:11px;color:var(--sub);margin-top:2px}
.scard.total{background:var(--blue);grid-column:1/-1}
.scard.total .scard-label{color:rgba(255,255,255,.7)}
.scard.total .scard-val{color:#fff;font-size:28px}
.scard.total .scard-sub{color:rgba(255,255,255,.6)}

.entries-wrap{background:var(--surface);border-radius:var(--radius);overflow:hidden}
.entry-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.entry-row:last-child{border-bottom:none}
.entry-date{font-size:20px;font-weight:700;color:var(--text);min-width:28px;text-align:center}
.entry-date-m{font-size:10px;color:var(--muted);text-align:center;margin-top:1px}
.entry-body{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.badge-car{background:#DBEAFE;color:#1d4ed8}
.badge-bike{background:#DCFCE7;color:#166534}
.badge-transit{background:#FEF3C7;color:#92400e}
.entry-detail{font-size:12px;color:var(--muted);margin-top:3px}
.entry-cost{font-size:15px;font-weight:700;color:var(--text)}
.del-btn{background:none;border:none;cursor:pointer;color:var(--sub);padding:4px;border-radius:6px}
.del-btn:active{color:var(--red)}
.del-btn svg{width:18px;height:18px;stroke-width:1.8}

/* Settings */
.set-card{background:var(--surface);border-radius:var(--radius);padding:0 14px;margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:13px;color:var(--muted);flex:1;display:flex;align-items:center;gap:6px}
.set-label svg{width:16px;height:16px;stroke-width:1.8}
.set-row input{width:80px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font-size:14px;text-align:right;font-family:inherit;background:var(--bg);color:var(--text)}
.set-unit{font-size:13px;color:var(--muted);min-width:28px}
.save-btn{width:100%;padding:14px;background:none;border:1.5px solid var(--blue);color:var(--blue);border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.save-btn:active{background:var(--blue-light)}

.empty{text-align:center;padding:32px 0;color:var(--sub);font-size:13px}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

<script>
const SK='ats_v2_entries', SS='ats_v2_settings';
let cfg={carKm:10,bikeKm:20,fuel:170};
let entries=[];
let cY,cM,selDate,transport="car",sY,sM;

function load(){
 try{const s=localStorage.getItem(SS);if(s)cfg={...cfg,...JSON.parse(s)};}catch(e){}
 try{const e=localStorage.getItem(SK);if(e)entries=JSON.parse(e);}catch(e){}
}
function save(){try{localStorage.setItem(SK,JSON.stringify(entries));}catch(e){}}

function init(){
 load();
 const n=new Date();
 cY=n.getFullYear();cM=n.getMonth();
 sY=cY;sM=cM;
 selDate=fmt(cY,cM+1,n.getDate());
 rCal();rSet();rSum();updPrev();
}

function fmt(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}

function chM(d){cM+=d;if(cM>11){cM=0;cY++;}if(cM<0){cM=11;cY--;}rCal();}
function chSM(d){sM+=d;if(sM>11){sM=0;sY++;}if(sM<0){sM=11;sY--;}rSum();}

function rCal(){
 document.getElementById('cal-lbl').textContent=cY+'年 '+(cM+1)+'月';
 const g=document.getElementById('cal-grid');g.innerHTML='';
 ['日','月','火','水','木','金','土'].forEach(d=>{
 const e=document.createElement('div');e.className='cdn';e.textContent=d;g.appendChild(e);
 });
 const first=new Date(cY,cM,1).getDay();
 const days=new Date(cY,cM+1,0).getDate();
 const today=new Date();
 const dSet=new Set(entries.map(e=>e.date));
 for(let i=0;i<first;i++){const e=document.createElement('div');g.appendChild(e);}
 for(let d=1;d<=days;d++){
 const ds=fmt(cY,cM+1,d);
 const e=document.createElement('div');e.className='cd';e.textContent=d;
 if(today.getFullYear()===cY&&today.getMonth()===cM&&today.getDate()===d)e.classList.add('today');
 if(selDate===ds)e.classList.add('sel');
 if(dSet.has(ds))e.classList.add('dot');
 e.onclick=()=>{selDate=ds;rCal();updPrev();};
 g.appendChild(e);
 }
}

function selTransport(t){
 transport=t;
 ['car','bike','transit'].forEach(k=>document.getElementById('tbtn-'+k).classList.toggle('active',k===t));
 const v=t==='car'||t==='bike';
 document.getElementById('blk-dist').style.display=v?'':'none';
 document.getElementById('blk-amt').style.display=v?'none':'';
 updPrev();
}

function calcCost(t,v){
 if(t==='car')return Math.round((v/cfg.carKm)*cfg.fuel);
 if(t==='bike')return Math.round((v/cfg.bikeKm)*cfg.fuel);
 return v;
}

function updPrev(){
 const p=document.getElementById('preview');
 if(transport==='car'||transport==='bike'){
 const d=parseFloat(document.getElementById('inp-dist').value)||0;
 if(d<=0){p.innerHTML='距離を入力してください';return;}
 const km=transport==='car'?cfg.carKm:cfg.bikeKm;
 const L=(d/km).toFixed(2);
 const c=calcCost(transport,d);
 p.innerHTML=d+'km → '+L+'L × '+cfg.fuel+'円 = <b>'+c.toLocaleString()+'円</b>';
 } else {
 const a=parseInt(document.getElementById('inp-amt').value)||0;
 if(a<=0){p.innerHTML='金額を入力してください';return;}
 p.innerHTML='交通費: <b>'+a.toLocaleString()+'円</b>';
 }
}

function addEntry(){
 if(!selDate){toast('日付を選択してください');return;}
 let value=0,cost=0;
 if(transport==='car'||transport==='bike'){
 value=parseFloat(document.getElementById('inp-dist').value)||0;
 if(value<=0){toast('距離を入力してください');return;}
 cost=calcCost(transport,value);
 } else {
 value=parseInt(document.getElementById('inp-amt').value)||0;
 if(value<=0){toast('金額を入力してください');return;}
 cost=value;
 }
 const memo=document.getElementById('inp-memo').value.trim();
 entries.push({id:Date.now(),date:selDate,transport:transport,value,cost,memo});
 entries.sort((a,b)=>a.date.localeCompare(b.date));
 save();
 document.getElementById('inp-dist').value='';
 document.getElementById('inp-amt').value='';
 document.getElementById('inp-memo').value='';
 updPrev();rCal();
 toast('追加しました ✓');
}

function delEntry(id){
 if(!confirm('この記録を削除しますか？'))return;
 entries=entries.filter(e=>e.id!==id);
 save();rCal();rSum();
}

function rSum(){
 document.getElementById('sum-lbl').textContent=sY+'年 '+(sM+1)+'月';
 const f=entries.filter(e=>{const[y,m]=e.date.split('-').map(Number);return y===sY&&m===sM+1;});
 const tot=f.reduce((s,e)=>s+e.cost,0);
 const cT=f.filter(e=>e.transport==='car').reduce((s,e)=>s+e.cost,0);
 const bT=f.filter(e=>e.transport==='bike').reduce((s,e)=>s+e.cost,0);
 const tT=f.filter(e=>e.transport==='transit').reduce((s,e)=>s+e.cost,0);
 const tn={car:'車',bike:'バイク',transit:'公共交通'};

 document.getElementById('sum-cards').innerHTML=
 '<div class="scard total"><div class="scard-label">月合計</div><div class="scard-val">¥'+tot.toLocaleString()+'</div><div class="scard-sub">'+f.length+'件</div></div>'+
 '<div class="scard"><div class="scard-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14" stroke-width="2"><path d="M3 10l1.5-4.5h15L21 10M3 10h18v6H3z"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg> 車</div><div class="scard-val">¥'+cT.toLocaleString()+'</div></div>'+
 '<div class="scard"><div class="scard-label">🏍 バイク</div><div class="scard-val">¥'+bT.toLocaleString()+'</div></div>'+
 '<div class="scard"><div class="scard-label">🚃 公共交通</div><div class="scard-val">¥'+tT.toLocaleString()+'</div></div>';

 const el=document.getElementById('entry-list');
 if(f.length===0){el.innerHTML='<div class="empty">この月の記録はありません</div>';return;}
 const tBadge={car:'badge-car',bike:'badge-bike',transit:'badge-transit'};
 el.innerHTML='<div class="entries-wrap">'+f.map(e=>{
 const d=e.date.split('-')[2];
 const mo=e.date.split('-')[1];
 const det=(e.transport==='car'||e.transport==='bike')?e.value+'km走行':'直接入力';
 return '<div class="entry-row">'+
 '<div><div class="entry-date">'+d+'</div><div class="entry-date-m">'+mo+'/'+d+'</div></div>'+
 '<div class="entry-body">'+
 '<span class="badge '+tBadge[e.transport]+'">'+tn[e.transport]+'</span>'+
 '<div class="entry-detail">'+det+(e.memo?' · '+e.memo:'')+'</div>'+
 '</div>'+
 '<div class="entry-cost">¥'+e.cost.toLocaleString()+'</div>'+
 '<button class="del-btn" onclick="delEntry('+e.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>'+
 '</div>';
 }).join('')+'</div>';
}

function rSet(){
 document.getElementById('set-car').value=cfg.carKm;
 document.getElementById('set-bike').value=cfg.bikeKm;
 document.getElementById('set-fuel').value=cfg.fuel;
}

function saveSet(){
 cfg.carKm=parseFloat(document.getElementById('set-car').value)||10;
 cfg.bikeKm=parseFloat(document.getElementById('set-bike').value)||20;
 cfg.fuel=parseFloat(document.getElementById('set-fuel').value)||170;
 try{localStorage.setItem(SS,JSON.stringify(cfg));}catch(e){}
 updPrev();toast('設定を保存しました ✓');
}

function swTab(t){
 ['input','sum','set'].forEach(k=>{
 document.getElementById('pane-'+k).classList.toggle('active',k===t);
 document.getElementById('tab-'+k).classList.toggle('active',k===t);
 });
 if(t==='sum')rSum();
 document.getElementById('scroll-area').scrollTop=0;
}

function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;el.classList.add('show');
 setTimeout(()=>el.classList.remove('show'),2200);
}

init();
</script>
